[package]
name = "markdowner-desktop"
version = "0.260823.0"
description = "Markdowner desktop shell"
edition = "2024"
default-run = "markdowner-desktop"

[lib]
name = "markdowner_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
markdowner-core = { path = "../crates/markdowner-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
regex = "1"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-cli = "2.4.1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-window-state = "2.4.1"
portable-pty = "0.9.0"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.18"
rusqlite = { version = "0.40.1", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
tempfile = "3"
webpx = { version = "0.4.0", default-features = false, features = ["encode", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
# Default-app (.md) registration through NSWorkspace / UTType.
security-framework = "3.7.0"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFDate"] }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSURL", "NSString", "NSError", "NSData", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSBitmapImageRep", "block2", "objc2-uniform-type-identifiers"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKPDFConfiguration", "WKSnapshotConfiguration", "WKNavigation", "WKNavigationDelegate", "block2", "objc2-app-kit", "objc2-core-foundation"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage"] }
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }
block2 = "0.6"
